<!-- Slider main container -->
<div class="swiper" #swiperDiv>
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper">
    @for (image of images(); track $index) {
      <div class="swiper-slide">
        <img
          [src]="image | productImage"
          alt="Producto"
          class="h-full w-full rounded-box bg-base-200 object-contain p-3 animate-fadeIn"
        />
      </div>
    } @empty {
      <div
        class="swiper-slide flex flex-col items-center justify-center gap-3 rounded-box bg-base-200 text-base-content/50"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.25"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 16.5V6.75A2.25 2.25 0 0 1 5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 17.25m0-.75 4.5-4.5 3 3 4.5-6 6 7.5M15.75 8.25h.008v.008h-.008V8.25Z"
          />
        </svg>
        <span class="text-sm">Sin imágenes disponibles</span>
      </div>
    }

  </div>
  @if (images().length > 1) {
    <div class="swiper-pagination"></div>

    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <div class="swiper-scrollbar"></div>
  }
</div>
