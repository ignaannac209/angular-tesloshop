
<div class="card h-full animate-fade-in bg-base-100 shadow-sm">
  <figure class="aspect-square overflow-hidden bg-base-200">
    <img
      [src]="product().images | productImage"
      [alt]="product().title"
      class="h-full w-full object-contain p-2"
    />
  </figure>
  <div class="card-body flex flex-1 flex-col">
    <h2
      class="card-title min-h-12 line-clamp-2 cursor-pointer font-montserrat text-lg text-accent hover:underline"
      [routerLink]="['/product', product().slug]"
    >
      {{ product().title }}
    </h2>
    <p class="min-h-12 line-clamp-2">
      {{ product().description | slice: 0:70 }}...
    </p>
    <div class="card-actions mt-auto justify-end">
      <a class="link link-accent" [routerLink]="['/product', product().slug ]">
        Ver Producto
      </a>
    </div>
  </div>
</div>
