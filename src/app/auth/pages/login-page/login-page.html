<h1 class="text-2xl font-montserrat font-bold text-secondary text-center mb-2">
  Autenticación
</h1>

<form class="flex flex-col gap-2" [formGroup]="loginForm" (ngSubmit)="onSubmit()"
>

<!-- Email -->
<label class="input input-bordered flex items-center gap-2">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="currentColor"
    class="h-4 w-4 opacity-70">
    <path
      d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" />
    <path
      d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" />
  </svg>
  <input type="text" class="grow" placeholder="Email" formControlName="email" />
</label>

<!-- Password -->
<div class="input input-bordered flex items-center gap-2">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="currentColor"
    class="h-4 w-4 opacity-70">
    <path
      fill-rule="evenodd"
      d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
      clip-rule="evenodd" />
  </svg>
  <input [type]="showPassword() ? 'text' : 'password'" class="grow" placeholder="Contraseña" formControlName="password" />
  <button
    type="button"
    class="btn btn-ghost btn-xs px-2"
    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="showPassword()"
    (click)="showPassword.set(!showPassword())">
    @if (showPassword()) {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.9 5.2A10.8 10.8 0 0112 5c5.2 0 8.8 4.7 9.8 6.4a1.2 1.2 0 010 1.2 16.4 16.4 0 01-3.1 3.7M6.2 6.2a17.2 17.2 0 00-4 5.2 1.2 1.2 0 000 1.2C3.2 14.3 6.8 19 12 19c1.2 0 2.3-.3 3.3-.8" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.2 12s3.6-7 9.8-7 9.8 7 9.8 7-3.6 7-9.8 7-9.8-7-9.8-7z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>

<button type="submit" class="btn btn-secondary">Login</button>

<p class="text-white">
  ¿No tienes cuenta?
  <a routerLink="/auth/register" class="text-accent">Crea una aquí</a>
</p>

</form>

 @if (hasError()) {
    <div role="alert" class="alert alert-error animate-fade-in fixed bottom-5 right-5 w-[calc(100%-2rem)] max-w-xs">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 shrink-0 stroke-current"
      fill="none"
      viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" stroke-width="2" />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="m9 9 6 6m0-6-6 6" />
    </svg>
    <span>Por favor verifique la información ingresada.</span>
      </div>
  }
